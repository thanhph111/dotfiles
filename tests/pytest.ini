[pytest]
pythonpath = .
testpaths =
    suites
markers =
    tier_local: Included in local tier
    tier_smoke: Included in smoke tier (and above)
    tier_full: Included in full tier only
    platform_linux: Linux-oriented checks
    platform_darwin: Darwin/macOS-oriented checks
    platform_windows: Windows/PowerShell-oriented checks
    requires_docker: Requires Docker runtime
    native_ci_only: Native host checks intended only for CI
addopts = -ra
