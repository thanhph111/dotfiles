repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        entry: mise x -- ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff-format
        entry: mise x -- ruff format --force-exclude
        language: system
        types_or: [python, pyi]

      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: mise x -- markdownlint-cli2 --fix
        language: system
        types: [markdown]

      - id: dprint
        name: dprint
        entry: mise x -- dprint fmt --allow-no-files
        language: system
        types: [text]
        pass_filenames: true

      - id: ty
        name: ty
        entry: mise x -- ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: true
