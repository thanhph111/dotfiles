machines:
  defaults:
    global:
      personal: true
      vault: Personal
      headless: false
      client: false
      agent: false
      shared: false
      hasSudo: true
      gitName: Thanh Phan
      gitEmail: thanhph111@gmail.com
      gitSigningKey: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEzkDbY48HpcP2GIKT4N4w9iqtSt+IDVnqDEXDZrZZf0

  matches:
    hostnames:
      arwen: arwen
      rev-9: rev-9
      tars: tars
    hostnamePrefixes:
      vm02-: sonny

  entries:
    arwen:
      displayName: Arwen
      profile: windows-desktop

    rev-9:
      displayName: Rev-9
      profile: linux-desktop
      features:
        linux:
          install:
            apt:
              repositories:
                nvidia_container_toolkit:
                  enabled: true
          security:
            sudo_ssh_agent_auth:
              enabled: true
          services:
            ssh_server:
              enabled: true
            xrdp:
              enabled: true
            code_server:
              enabled: true
              host: 127.0.0.1
              port: 9999
            samba:
              enabled: true

    sonny:
      displayName: Sonny
      profile: linux-minimal
      users:
        thanhph111:
          shared: false
          hasSudo: true
          gitName: Thanh Phan
          gitEmail: thanhph111@gmail.com

    tars:
      displayName: TARS
      profile: darwin-personal
