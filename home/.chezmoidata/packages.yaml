packages:
  linux:
    apt:
      enabled: true
      upgrade_on_apply: false
      autoremove_on_apply: false
      debian_components:
        enabled: true
        values:
          - contrib
          - non-free
          - non-free-firmware
      repositories:
        onepassword:
          enabled: true
        google_chrome:
          enabled: true
        vscode:
          enabled: true
        powershell:
          enabled: true
        docker:
          enabled: true
        ibus_bamboo:
          enabled: true
        cloudflare_warp:
          enabled: false
        cloudflared:
          enabled: true
        openvpn3:
          enabled: false
    brew:
      enabled: true
      link_fonts: true
    flatpak:
      enabled: true
    mise:
      enabled: true
    gnome:
      enabled: true
      extensions:
        enabled: true
      settings:
        enabled: true
    system:
      sudoers_disable_admin_flag: true
      sudo_ssh_agent_auth:
        enabled: false
        authorized_keys_dir: /etc/security/sudo_authorized_keys
        package: libpam-ssh-agent-auth
      rtc_local_time: true
      account_avatar: true
      ufw:
        enabled: true
        default_incoming: deny
        default_outgoing: allow
        allow_tcp_ports: []
      ssh_server:
        enabled: false
        open_firewall: false
        disable_password_login: true
        trusted_user_ca_keys: /etc/ssh/ca.pub
      rdp:
        enabled: false
        open_firewall: false
      code_server:
        enabled: false
        command: code
        host: 127.0.0.1
        port: 9999

  darwin:
    brew:
      enabled: true
    mise:
      enabled: true
    settings:
      enabled: true
    openclaw_onboard:
      enabled: true

  windows:
    winget:
      enabled: true
    scoop:
      enabled: true
    mise:
      enabled: true
    settings:
      enabled: true
