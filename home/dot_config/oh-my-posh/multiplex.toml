# : schema https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
# : https://ohmyposh.dev/docs
# : https://www.nerdfonts.com/cheat-sheet
# : https://onlineunicodetools.com/escape-unicode
# : https://dencode.com/en/string/unicode-escape

"$schema" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
console_title_template = '{{ .Shell }} ✤ {{ .Folder }}'
final_space = true
version = 4

[upgrade]
notice = false

[palette]
# : Create palette match terminal colors
black = 'black' # '#181a1b'
blue = 'blue' # '#0a6ab6'
cyan = 'cyan' # '#37aab9'
darkGray = 'darkGray' # '#555b5e'
green = 'green' # '#2b803e'
lightBlue = 'lightBlue' # '#0287c3'
lightCyan = 'lightCyan' # '#4ae3f7'
lightGreen = 'lightGreen' # '#addd1e'
lightMagenta = 'lightMagenta' # '#d10aff'
lightRed = 'lightRed' # '#ff3078'
lightWhite = 'lightWhite' # '#dcdfe4'
lightYellow = 'lightYellow' # '#ffec16'
magenta = 'magenta' # '#522e92'
red = 'red' # '#a91409'
white = 'white' # '#788187'
yellow = 'yellow' # '#cc7a00'

[[blocks]]
type = 'prompt'
alignment = 'left'

[[blocks.segments]]
leading_diamond = ''
template = ' <b>{{ now | date "15:04:05" }}</b> '
foreground = 'p:lightWhite'
background = 'p:red'
type = 'time'
style = 'diamond'

[blocks.segments.options]
cache_duration = 'none'

[[blocks.segments]]
# The zmx marker names the session this shell lives in.  A zmx session
# outlives its connection, so it may be one started days ago elsewhere.
template = """\
{{ if .Env.ZMX_SESSION }} \
    󰆍 {{ .Env.ZMX_SESSION }}\
{{ end }}\
{{ if .SSHSession }} \
    󰌘\
{{ end }}\

{{ if .Root }}\
    󰒘 \
{{ end }} \
{{ .UserName }}\
"""
foreground = 'p:lightWhite'
powerline_symbol = ''
background = 'p:yellow'
type = 'session'
style = 'powerline'

[blocks.segments.options]
cache_duration = 'none'

[[blocks.segments]]
template = """ \
●\
{{ if .WSL }} \
    WSL at\
{{ end }} \

{{.Icon}}\

{{ if .Env.NIX_BINTOOLS }} \
     \
{{ end }} \
<b>{{ .HostName }}</b>\
"""
foreground = 'p:lightWhite'
background = 'p:yellow'
type = 'os'
style = 'powerline'

[blocks.segments.options]
cache_duration = 'none'

[[blocks.segments]]
template = ' ● {{ .Name }} '
foreground = 'p:lightWhite'
background = 'p:yellow'
type = 'shell'
style = 'powerline'

[blocks.segments.options]
cache_duration = 'none'

[blocks.segments.options.mapped_shell_names]
bash = 'Bash'
fish = 'Fish'
lua = 'Lua'
pwsh = 'PowerShell'
zsh = 'Zsh'

[[blocks.segments]]
template = '{{ if not .Env.HISTFILE }}󰈉{{ end }} '
foreground = 'p:lightWhite'
background = 'p:yellow'
type = 'text'
style = 'powerline'

[blocks.segments.options]
cache_duration = 'none'

[[blocks.segments]]
template = ' {{ .Path }} '
foreground = 'p:lightWhite'
powerline_symbol = ''
background = 'p:blue'
type = 'path'
style = 'powerline'

[blocks.segments.options]
cache_duration = 'none'
enable_hyperlink = true
folder_icon = ''
folder_separator_icon = ' › '
home_icon = ''
max_depth = 1.0
style = 'agnoster_short'

[blocks.segments.options.mapped_locations]
'/' = '漣› '
'C\:' = '漣 '
'~/Desktop/Projects' = ' '
'~/Documents/Projects' = ' '

[[blocks.segments]]
template = """ \
󰌠 \
{{ if .Error }}\
    {{ .Error }}\
{{ else }}\
    {{ .Major }}.{{ .Minor }}.{{ .Patch }}\
{{ end }} \
"""
foreground = 'p:lightWhite'
powerline_symbol = ''
background = 'p:green'
type = 'python'
style = 'powerline'

[blocks.segments.options]
cache_duration = 'none'

[[blocks.segments]]
template = """ \
{{ if .UpstreamIcon }}\
    {{ .UpstreamIcon }} \
{{ end }}\

{{ .HEAD }} \

{{ .BranchStatus }}\

{{ if .Working.Changed }} \
    │\
    {{ if gt .Working.Untracked 0 }} \
         {{ .Working.Untracked }}\
    {{ end }}\
    {{ if gt .Working.Modified 0 }} \
         {{ .Working.Modified }}\
    {{ end }}\
    {{ if gt .Working.Deleted 0 }} \
         {{ .Working.Deleted }}\
    {{ end }}\
    {{ if gt .Working.Unmerged 0 }} \
         {{ .Working.Unmerged }}\
    {{ end }}\
{{ end }}\

{{ if .Staging.Changed }} \
    ┊\
    {{ if gt .Staging.Added 0 }} \
        <p:green></> {{ .Staging.Added }}\
    {{ end }}\
    {{ if gt .Staging.Modified 0 }} \
        <p:lightYellow></> {{ .Staging.Modified }}\
    {{ end }}\
    {{ if gt .Staging.Deleted 0 }} \
        <p:red></> {{ .Staging.Deleted }}\
    {{ end }}\
    {{ if gt .Staging.Unmerged 0 }} \
        <p:blue></> {{ .Staging.Unmerged }}\
    {{ end }}\
{{ end }}\
{{ if gt .StashCount 0 }} \
    │ 󰆓 {{ .StashCount }}\
{{ end }} \
"""
foreground = 'p:black'
powerline_symbol = ''
background = 'p:lightGreen'
type = 'git'
style = 'powerline'
foreground_templates = [
    '{{ if or (.Working.Changed) (.Staging.Changed) }}p:lightWhite{{ end }}',
    '{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:lightWhite{{ end }}',
    '{{ if gt .Ahead 0 }}p:black{{ end }}',
    '{{ if gt .Behind 0 }}p:lightWhite{{ end }}',
]
background_templates = [
    '{{ if or (.Working.Changed) (.Staging.Changed) }}p:magenta{{ end }}',
    '{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:yellow{{ end }}',
    '{{ if gt .Ahead 0 }}p:lightYellow{{ end }}',
    '{{ if gt .Behind 0 }}p:red{{ end }}',
]

[blocks.segments.options]
branch_ahead_icon = '󰆸'
branch_behind_icon = '󰆹'
branch_gone_icon = ' '
branch_icon = ' '
branch_identical_icon = ' '
branch_max_length = 20
cache_duration = 'none'
commit_icon = ' '
fetch_stash_count = true
fetch_status = true
fetch_upstream_icon = true
git_icon = ' '
tag_icon = ' '
truncate_symbol = '…'

[[blocks]]
type = 'prompt'
alignment = 'left'

[[blocks.segments]]
leading_diamond = ' '
trailing_diamond = ''
template = '  {{ .Code }} '
foreground = 'p:lightWhite'
background = 'p:red'
type = 'status'
style = 'diamond'

[blocks.segments.options]
cache_duration = 'none'

[[blocks]]
type = 'prompt'
alignment = 'left'

[[blocks.segments]]
leading_diamond = ' '
trailing_diamond = ''
template = ' {{ .FormattedMs }} '
foreground = 'p:lightWhite'
background = 'p:green'
type = 'executiontime'
style = 'diamond'

[blocks.segments.options]
cache_duration = 'none'
style = 'austin'

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

[[blocks.segments]]
template = '▶'
foreground = 'p:blue'
type = 'text'
style = 'plain'

[blocks.segments.options]
cache_duration = 'none'

[[blocks.segments]]
template = '{{ if .Env.OMP_SUFFIX }}{{ .Env.OMP_SUFFIX }}{{ end }}'
type = 'text'
style = 'plain'

[blocks.segments.options]
cache_duration = 'none'
