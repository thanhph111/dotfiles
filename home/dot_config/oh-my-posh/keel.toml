# : schema https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
# : https://ohmyposh.dev/docs/configuration/general
# : https://ohmyposh.dev/docs/configuration/block
# : https://ohmyposh.dev/docs/configuration/colors
# : https://ohmyposh.dev/docs/segments/system/path
# : https://ohmyposh.dev/docs/segments/scm/git

# Keel is a plain, single-line prompt.
#
# Keep it boring at the terminal boundary:
# - one left prompt block
# - no prompt newlines
# - no right prompt
# - no font-specific icons
# - foreground colors only

"$schema" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
console_title_template = "{{ .Shell }} - {{ .Folder }}"
final_space = true
version = 4

[upgrade]
notice = false

[palette]
# ANSI colors follow the active terminal theme, so they travel well between
# macOS, Linux, SSH, dark themes, and light themes.
session = "yellow"
ssh = "cyan"
path = "lightBlue"
label = "darkGray"
clean = "green"
sync = "cyan"
dirty = "lightMagenta"
work = "red"
stage = "green"
stash = "lightYellow"
time = "darkGray"
prompt = "green"
error = "lightRed"

# Main prompt
[[blocks]]
type = "prompt"
alignment = "left"

# user@host
[[blocks.segments]]
type = "session"
style = "plain"
foreground = "p:session"
foreground_templates = [
    "{{ if .Root }}p:error{{ end }}",
]
template = """\
{{ if .SSHSession }}\
    <p:ssh>ssh:</>\
{{ end }}\
{{ .UserName }}@{{ .HostName }} \
"""

[blocks.segments.cache]
duration = "none"

# path
[[blocks.segments]]
type = "path"
style = "plain"
foreground = "p:path"
template = """{{ regexReplaceAll `([^/\\\\]{13})[^/\\\\]{5,}([^/\\\\]{5})([/\\\\]|$)` .Path `${1}…${2}${3}` }} """

[blocks.segments.options]
style = "agnoster_short"
folder_separator_icon = "/"
folder_icon = "…"
home_icon = "~"
max_depth = 4

[blocks.segments.options.mapped_locations]
# Delta marks a collapsed project root without looking like a real home folder.
"~/Documents/Projects/Work" = "Δ/Work"
"~/Documents/Projects/Personal" = "Δ/Personal"
'~\Documents\Projects\Work' = 'Δ\Work'
'~\Documents\Projects\Personal' = 'Δ\Personal'

[blocks.segments.cache]
duration = "none"

# git
[[blocks.segments]]
type = "git"
style = "plain"
foreground = "p:clean"
template = """\
<p:label>git:</>\
{{ if or (.Working.Changed) (.Staging.Changed) (gt .StashCount 0) }}\
    <p:dirty>{{ .HEAD }}</>\
{{ else if or (gt .Ahead 0) (gt .Behind 0) }}\
    <p:sync>{{ .HEAD }}</>\
{{ else }}\
    <p:clean>{{ .HEAD }}</>\
{{ end }}\
{{ if .BranchStatus }} <p:sync>{{ .BranchStatus }}</>{{ end }}\
{{ if .Working.Changed }} <p:work>w:{{ .Working.String }}</>{{ end }}\
{{ if .Staging.Changed }} <p:stage>s:{{ .Staging.String }}</>{{ end }}\
{{ if gt .StashCount 0 }} <p:stash>stash:{{ .StashCount }}</>{{ end }} \
"""

[blocks.segments.options]
branch_ahead_icon = "↑"
branch_behind_icon = "↓"
# Oh My Posh uses this for both missing tracking and deleted remote branches.
branch_gone_icon = "local"
branch_icon = ""
branch_identical_icon = "≡"
branch_template = """{{ regexReplaceAll "^(.{24}).{6,}(.{8})$" .Branch "${1}…${2}" }}"""
fetch_status = true
fetch_stash_count = true
source = "cli"

[blocks.segments.cache]
duration = "5s"

# slow command duration
[[blocks.segments]]
type = "executiontime"
style = "plain"
foreground = "p:time"
template = "took:{{ .FormattedMs }} "

[blocks.segments.options]
style = "austin"
threshold = 1000

[blocks.segments.cache]
duration = "none"

# exit status and prompt marker
[[blocks.segments]]
type = "status"
style = "plain"
foreground = "p:prompt"
template = "{{ if .Error }}<p:error>exit:{{ .String }}</> {{ end }}<p:prompt>$</>"

[blocks.segments.options]
always_enabled = true

[blocks.segments.cache]
duration = "none"

# Continuation prompt
[secondary_prompt]
background = "transparent"
foreground = "p:prompt"
template = "> "
